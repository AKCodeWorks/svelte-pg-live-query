services:
  db:
    image: postgres:18-alpine

    container_name: postgres-db

    restart: unless-stopped

    ports:
      - '1330:5432'

    environment:
      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: app

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
